{% extends "base.html" %}
{% block title %}验证邮箱 — 梦境记录{% endblock %}
{% block body %}
<div class="card">
  <h1>验证邮箱</h1>
  <p class="muted">请查收邮件中的 6 位验证码（发信已正确配置时，数分钟内应送达<strong>{{ email }}</strong>，也请看垃圾箱）。若服务器尚未配置 Resend 或 SMTP，验证码只会打印在运行程序的终端里。</p>
  {% if error %}<p class="err">{{ error }}</p>{% endif %}
  <form method="post" action="{{ url_for('register_confirm') }}" class="stack-form">
    <p><label>验证码<br><input type="text" name="code" inputmode="numeric" autocomplete="one-time-code" required placeholder="6 位数字"></label></p>
    <p><label>昵称（可选，站内显示）<br><input type="text" name="nickname" maxlength="24" autocomplete="nickname" placeholder="默认使用邮箱 @ 前一段"></label></p>
    <p><label>设置密码<br><input type="password" name="password" required minlength="6" autocomplete="new-password"></label></p>
    <button type="submit">完成注册</button>
  </form>
  <form method="post" action="{{ url_for('register_resend') }}" style="margin-top:0.5rem;">
    <button type="submit" class="secondary">重新发送验证码</button>
  </form>
  <p class="link-row"><a href="{{ url_for('register') }}">换一个邮箱</a></p>
</div>
{% endblock %}
