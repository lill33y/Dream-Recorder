{% extends "base.html" %}
{% block title %}忘记密码 — 梦境记录{% endblock %}
{% block body %}
<div class="card">
  <h1>忘记密码</h1>
  <p class="muted">输入注册时使用的邮箱。若账号存在，你会收到一封带重置链接的邮件（开发环境请看终端日志）。</p>
  {% if error %}<p class="err">{{ error }}</p>{% endif %}
  {% if ok %}<p class="ok">{{ ok }}</p>{% endif %}
  <form method="post" action="{{ url_for('forgot_password') }}" class="stack-form">
    <p><label>邮箱<br><input type="email" name="email" required autocomplete="email"></label></p>
    <button type="submit">发送重置链接</button>
  </form>
  <p class="link-row"><a href="{{ url_for('login') }}">返回登录</a></p>
</div>
{% endblock %}
