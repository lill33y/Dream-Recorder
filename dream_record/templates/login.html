{% extends "base.html" %}
{% block title %}登录 — 梦境记录{% endblock %}
{% block body %}
<div class="card">
  <h1>登录</h1>
  {% if error %}<p class="err">{{ error }}</p>{% endif %}
  <form method="post" action="{{ url_for('login') }}" class="stack-form">
    {% if request.args.get('next') %}
    <input type="hidden" name="next" value="{{ request.args.get('next') }}">
    {% endif %}
    <p><label>邮箱<br><input type="email" name="email" required autocomplete="username"></label></p>
    <p><label>密码<br><input type="password" name="password" required autocomplete="current-password"></label></p>
    <button type="submit">登录</button>
  </form>
  <p class="link-row"><a href="{{ url_for('forgot_password') }}">忘记密码？</a></p>
  <p class="link-row">还没有账号？<a href="{{ url_for('register') }}">去注册</a></p>
</div>
{% endblock %}
