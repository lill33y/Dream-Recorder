{% extends "base.html" %}
{% block title %}设置新密码 — 梦境记录{% endblock %}
{% block body %}
<div class="card">
  <h1>设置新密码</h1>
  {% if error %}<p class="err">{{ error }}</p>{% endif %}
  <form method="post" action="{{ url_for('reset_password', token=token) }}" class="stack-form">
    <p><label>新密码<br><input type="password" name="password" required minlength="6" autocomplete="new-password"></label></p>
    <p><label>确认新密码<br><input type="password" name="password2" required minlength="6" autocomplete="new-password"></label></p>
    <button type="submit">保存密码</button>
  </form>
</div>
{% endblock %}
